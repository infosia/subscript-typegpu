[package]
name = "subscript-typegpu-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
test = false

[[bin]]
name = "subscript-typegpu-harness"
path = "src/main.rs"
test = false

[dependencies]
subscript-typegpu-facade = { path = "../facade" }
subscript-typegpu-gen = { path = "../typegpu-gen" }
subscript-compiler.workspace = true
subscript-codegen.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
