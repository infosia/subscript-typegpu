# --- F18 exclusion rows reachable from the
# --- subset objects (catalogue reasons) ------------------------------

[[exclude]]
construct = "addref"
reason = "F4 single-owner model excludes AddRef exports"

[[exclude]]
construct = "instance.wait_any"
reason = "non-portable; ProcessEvents is the one pump, so wgpuInstanceWaitAny is excluded"

[[exclude]]
construct = "device.get_lost_future"
reason = "F14 chose creation-callback delivery instead of GetLostFuture"

[[exclude]]
construct = "buffer.get_mapped_range"
reason = "raw pointers never cross the boundary (F20)"

[[exclude]]
construct = "buffer.get_const_mapped_range"
reason = "raw pointers never cross the boundary (F20)"

[[exclude]]
construct = "compute_pass_encoder.set_immediates"
reason = "immediate data and SetImmediates are outside the portable slice"

[[exclude]]
construct = "render_pass_encoder.set_immediates"
reason = "immediate data and SetImmediates are outside the portable slice"

[[exclude]]
construct = "render_bundle_encoder.set_immediates"
reason = "immediate data and SetImmediates are outside the portable slice"

# --- Exclusions deferred from the hand-written facade slice -----------

[[exclude]]
construct = "get_instance_features"
reason = "feature enumeration needs the parked mutable-pair and enum-parameter-pair requests"

[[exclude]]
construct = "instance.get_WGSL_language_features"
reason = "feature enumeration needs the parked mutable-pair and enum-parameter-pair requests"

[[exclude]]
construct = "instance.has_WGSL_language_feature"
reason = "no consumer; probe pattern exists — map on evidence"

[[exclude]]
construct = "adapter.get_features"
reason = "feature enumeration needs the parked mutable-pair and enum-parameter-pair requests"

[[exclude]]
construct = "device.get_features"
reason = "feature enumeration needs the parked mutable-pair and enum-parameter-pair requests"

[[exclude]]
construct = "shader_module.get_compilation_info"
reason = "compilation-info output records are deferred from the facade area work"

