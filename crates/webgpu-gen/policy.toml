# policy.toml — F18 policy for the facade area generator.
#
# Two-way validated against third_party/webgpu-headers/webgpu.yml:
# unknown, dead, duplicate, and unpoliced entries each fail generation
# with a named error (codegen/src/policy.rs). Subset-driven: exactly
# the constructs the hand-written facade slice needs; everything else
# on the subset objects is excluded here with an F18 reason.

[slice]
# The object anchoring the F6 future protocol.
future_anchor = "instance"
# Subset objects in subscript-typegpu.h typedef order (handle pattern: opaque
# typedef + Release-only wrapper each; AddRef excluded below).
objects = ["instance", "adapter", "device", "queue", "buffer", "texture", "texture_view", "sampler", "bind_group_layout", "bind_group", "pipeline_layout", "shader_module", "compute_pipeline", "render_pipeline", "command_encoder", "compute_pass_encoder", "render_pass_encoder", "command_buffer", "render_bundle_encoder", "render_bundle", "query_set"]

# Freestanding webgpu.h functions in the subset.
[[functions]]
name = "create_instance"
pattern = "create"
doc = "Creates an instance with no descriptor."

[[functions]]
name = "get_instance_limits"
pattern = "limits-fill"

[[functions]]
name = "has_instance_feature"
pattern = "feature-probe"

# Method rows in emission order. Reshape rows carry an F-rule reason.

[[map]]
method = "instance.process_events"
pattern = "sync"

[[map]]
method = "instance.request_adapter"
pattern = "future-poll"
reason = "async op; F6 future-poll triple over the F7/F8 slot machinery"

[[map]]
method = "adapter.get_limits"
pattern = "limits-fill"

[[map]]
method = "adapter.get_info"
pattern = "adapter-info-fill"
reason = "H3/F11 Rev 1 copies four owned strings and frees backend members internally"

[[map]]
method = "adapter.has_feature"
pattern = "feature-probe"

[[map]]
method = "adapter.request_device"
pattern = "future-poll"
reason = "async op; F6 future-poll triple over the F7/F8 slot machinery"

