[workspace]
resolver = "2"
members = [
    "crates/facade",
    "crates/webgpu-gen",
    "crates/typegpu-gen",
    "crates/harness",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/infosia/subscript-typegpu"

[workspace.dependencies]
subscript-bindgen = { git = "https://github.com/infosia/subscript.git", rev = "ac9436f" }
subscript-compiler = { git = "https://github.com/infosia/subscript.git", rev = "ac9436f" }
subscript-codegen = { git = "https://github.com/infosia/subscript.git", rev = "ac9436f" }
libloading = "0.8"
# subscript pins serde exactly. The workspace follows the pin so one serde resolves.
serde = { version = "=1.0.219", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"
